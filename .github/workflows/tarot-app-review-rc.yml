name: Tarot App Review RC binary upload

on:
  workflow_dispatch:
    inputs:
      public_rc_confirmation:
        description: "Upload public-capable 1.2.1 build 1 with production ads; review submission remains a separate API action"
        required: true
        default: "DO_NOT_UPLOAD"
        type: choice
        options:
          - "DO_NOT_UPLOAD"
          - "PUBLIC_1_2_1_BUILD_1"
      release_readiness:
        description: "Operator confirmation only: privacy and source reviewed; physical QA gates later review submission"
        required: true
        default: "PENDING"
        type: choice
        options:
          - "PENDING"
          - "PRIVACY_SOURCE_REVIEWED"
      verified_source_sha:
        description: "Exact full source commit covered by the readiness review; must match the dispatched commit"
        required: true
        default: "PENDING"
        type: string
      readiness_evidence:
        description: "Non-sensitive receipt path or reference for that review; never secrets or personal identifiers"
        required: true
        default: "PENDING"
        type: string
      private_ci_clearance:
        description: "Confirm private runner quota/storage and spend limit were checked before dispatch"
        required: true
        default: "PENDING"
        type: choice
        options:
          - "PENDING"
          - "PRIVATE_CI_NO_SPEND_VERIFIED"

permissions:
  contents: read

concurrency:
  group: tarot-app-review-rc
  cancel-in-progress: false

jobs:
  archive-export-upload:
    name: App Review RC binary - 1.2.1 (1)
    if: ${{ github.ref == 'refs/heads/main' && inputs.public_rc_confirmation == 'PUBLIC_1_2_1_BUILD_1' && inputs.release_readiness == 'PRIVACY_SOURCE_REVIEWED' && inputs.verified_source_sha == github.sha && inputs.readiness_evidence != '' && inputs.readiness_evidence != 'PENDING' && inputs.private_ci_clearance == 'PRIVATE_CI_NO_SPEND_VERIFIED' }}
    runs-on: macos-latest
    timeout-minutes: 45
    environment: app-store-production

    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record external readiness declaration for the exact source
        shell: bash
        env:
          VERIFIED_SOURCE_SHA: ${{ inputs.verified_source_sha }}
          READINESS_EVIDENCE: ${{ inputs.readiness_evidence }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$VERIFIED_SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ -n "${READINESS_EVIDENCE//[[:space:]]/}" && "$READINESS_EVIDENCE" != "PENDING" ]]
          jq -n --arg commit "$GITHUB_SHA" --arg evidence "$READINESS_EVIDENCE" \
            '{commit: $commit, operatorReadinessReference: $evidence, automatedPrivacyCertification: false, automatedPhysicalATTValidation: false}' \
            > "$RUNNER_TEMP/tarot-release-readiness.json"

      - name: Validate public RC workflow boundaries
        shell: pwsh
        run: ./native-ios/Tools/validate-app-review-workflow.ps1

      - name: Validate canonical content
        shell: pwsh
        run: |
          ./native-ios/Content/validate-content.ps1
          ./native-ios/Content/Education/validate-education.ps1
          ./native-ios/Content/Localization/validate-localization.ps1

      - name: Validate app integration and approved artwork
        shell: pwsh
        run: |
          ./native-ios/Tools/validate-app-integration.ps1

      - name: Validate production advertising and subscription contract
        shell: bash
        run: python3 native-ios/Tools/validate-monetization.py

      - name: Run structural Swift tests
        shell: bash
        run: swift test --package-path native-ios --parallel

      - name: Record simulator privacy capabilities without changing permissions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version > "$RUNNER_TEMP/tarot-qa-xcode-version.txt"
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/tarot-qa-simulator-runtimes.json"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/tarot-qa-simulator-devices.json"
          if xcrun simctl help privacy > "$RUNNER_TEMP/tarot-qa-simctl-privacy-help.txt" 2>&1; then
            echo "Saved actual runner privacy services; availability is evidence, not an ATT grant."
          else
            echo "simctl privacy help unavailable; no permission override attempted."
          fi
          echo "No simulator tracking permission is granted, revoked or mocked by this workflow."
          echo "The UMP sample message does not certify the production IDFA explainer or the real ATT prompt."

      - name: Compile and launch simulator app
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          echo "Simulator QA uses Google sample app/banner identifiers only; no production inventory."
          xcodebuild build -project native-ios/TarotDeck.xcodeproj \
            -scheme TarotDeckInternal -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/TarotAdsSimulator" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG TAROT_TEST_ADS" \
            TAROT_ADS_MODE=test-only \
            TAROT_ADMOB_APP_ID='ca-app-pub-3940256099942544~1458002511' \
            TAROT_ADMOB_BANNER_ID='ca-app-pub-3940256099942544/2435281174' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          SIMULATOR_PLIST="$RUNNER_TEMP/TarotAdsSimulator/Build/Products/Debug-iphonesimulator/TarotDeckInternal.app/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :TarotAdvertisingMode' "$SIMULATOR_PLIST")" == "test-only" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$SIMULATOR_PLIST")" == "ca-app-pub-3940256099942544~1458002511" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :TarotBannerAdUnitID' "$SIMULATOR_PLIST")" == "ca-app-pub-3940256099942544/2435281174" ]]
          DEVICE_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/TarotAdsSimulator/Build/Products/Debug-iphonesimulator/TarotDeckInternal.app"
          xcrun simctl launch "$DEVICE_ID" com.krazel.tarotdeck.internal.provisional
          for attempt in {1..12}; do
            sleep 5
            xcrun simctl spawn "$DEVICE_ID" log show --last 2m --style compact --predicate 'subsystem == "com.krazel.tarotdeck"' > "$RUNNER_TEMP/tarot-ads-runtime.log"
            if grep -q test_banner_loaded "$RUNNER_TEMP/tarot-ads-runtime.log"; then break; fi
          done
          grep -q test_banner_loaded "$RUNNER_TEMP/tarot-ads-runtime.log"
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/tarot-home-simulator.png"
          xcrun simctl terminate "$DEVICE_ID" com.krazel.tarotdeck.internal.provisional
          xcrun simctl uninstall "$DEVICE_ID" com.krazel.tarotdeck.internal.provisional
          xcrun simctl install "$DEVICE_ID" "$RUNNER_TEMP/TarotAdsSimulator/Build/Products/Debug-iphonesimulator/TarotDeckInternal.app"
          xcrun simctl launch "$DEVICE_ID" com.krazel.tarotdeck.internal.provisional --qa-consent-eea
          for attempt in {1..12}; do
            sleep 5
            xcrun simctl spawn "$DEVICE_ID" log show --last 2m --style compact --predicate 'subsystem == "com.krazel.tarotdeck"' > "$RUNNER_TEMP/tarot-consent-runtime.log"
            if grep -q consent_form_presenting "$RUNNER_TEMP/tarot-consent-runtime.log"; then break; fi
          done
          grep -q consent_form_presenting "$RUNNER_TEMP/tarot-consent-runtime.log"
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/tarot-consent-eea.png"
          echo "EN/ES purchase screenshots use DEBUG price/state fixtures, not real StoreKit transactions."
          for language in spanish english; do
            xcrun simctl terminate "$DEVICE_ID" com.krazel.tarotdeck.internal.provisional || true
            xcrun simctl launch "$DEVICE_ID" com.krazel.tarotdeck.internal.provisional --qa-settings "--qa-$language"
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/tarot-settings-$language.png"
            xcrun simctl terminate "$DEVICE_ID" com.krazel.tarotdeck.internal.provisional
            if [[ "$language" == spanish ]]; then PRICES='0,99 €|2,99 €|4,99 €|9,99 €|14,99 €|29,99 €|49,99 €'; else PRICES='€0.99|€2.99|€4.99|€9.99|€14.99|€29.99|€49.99'; fi
            xcrun simctl launch "$DEVICE_ID" com.krazel.tarotdeck.internal.provisional --qa-remove-ads "--qa-$language" --qa-prices "$PRICES"
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/tarot-remove-ads-$language.png"
            xcrun simctl terminate "$DEVICE_ID" com.krazel.tarotdeck.internal.provisional
            xcrun simctl launch "$DEVICE_ID" com.krazel.tarotdeck.internal.provisional --qa-remove-ads "--qa-$language" --qa-prices "$PRICES" --qa-active-product com.krazel.tarotdeck.support.monthly.499
            sleep 3
            xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/tarot-remove-ads-active-$language.png"
          done
          xcrun simctl shutdown "$DEVICE_ID"

      - name: Preserve simulator launch screenshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: TarotDeck-1.2.1-1-simulator-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tarot-home-simulator.png
            ${{ runner.temp }}/tarot-consent-eea.png
            ${{ runner.temp }}/tarot-ads-runtime.log
            ${{ runner.temp }}/tarot-consent-runtime.log
            ${{ runner.temp }}/tarot-settings-*.png
            ${{ runner.temp }}/tarot-remove-ads-*.png
          if-no-files-found: ignore
          retention-days: 1

      - name: Verify real sample consent choices in simulator
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          test -n "$DEVICE_ID"
          echo "Running UMP sample integration tests. Any observed ATT state must come from the OS; no production consent fixture is supplied."
          xcodebuild test -project native-ios/TarotDeck.xcodeproj \
            -scheme TarotDeckInternal -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/TarotAdsSimulator" \
            -resultBundlePath "$RUNNER_TEMP/TarotConsentQA.xcresult" \
            -parallel-testing-enabled NO -only-testing:TarotConsentUITests \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="DEBUG TAROT_TEST_ADS" \
            TAROT_ADS_MODE=test-only \
            TAROT_ADMOB_APP_ID='ca-app-pub-3940256099942544~1458002511' \
            TAROT_ADMOB_BANNER_ID='ca-app-pub-3940256099942544/2435281174' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/tarot-consent-tests.log"

      - name: Preserve native consent QA result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: TarotDeck-1.2.1-1-consent-qa-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/TarotConsentQA.xcresult
            ${{ runner.temp }}/tarot-consent-tests.log
            ${{ runner.temp }}/tarot-qa-xcode-version.txt
            ${{ runner.temp }}/tarot-qa-simulator-runtimes.json
            ${{ runner.temp }}/tarot-qa-simulator-devices.json
            ${{ runner.temp }}/tarot-qa-simctl-privacy-help.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Prepare App Store Connect upload key
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID is required in app-store-production}"
          : "${APP_STORE_CONNECT_API_KEY_ID:?APP_STORE_CONNECT_API_KEY_ID is required in app-store-production}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?APP_STORE_CONNECT_ISSUER_ID is required in app-store-production}"
          : "${APP_STORE_CONNECT_API_KEY_BASE64:?APP_STORE_CONNECT_API_KEY_BASE64 is required in app-store-production}"

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          test -s "$API_KEY_PATH"

      - name: Prepare existing distribution certificate and Tarot profile
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          set +x
          KEYCHAIN_PATH="$RUNNER_TEMP/tarot-signing.keychain-db"
          SIGNING_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/tarot-distribution.p12"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/tarot.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/tarot.mobileprovision" > "$RUNNER_TEMP/tarot-profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/tarot-profile.plist")"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/tarot-profile.plist")" == "$APPLE_TEAM_ID.com.krazel.tarotdeck" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/tarot-profile.plist")" == "false" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:beta-reports-active' "$RUNNER_TEMP/tarot-profile.plist")" == "true" ]]
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/tarot.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          security create-keychain -p "$SIGNING_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$SIGNING_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/tarot-distribution.p12" -k "$KEYCHAIN_PATH" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$SIGNING_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution'

      - name: Archive signed Release app with existing distribution identity
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          set +x
          ARCHIVE_PATH="$RUNNER_TEMP/TarotDeck-AppReview-1.2.1-1.xcarchive"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          xcodebuild archive \
            -project native-ios/TarotDeck.xcodeproj \
            -scheme TarotDeckInternal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Tarot Deck App Store 2026-10-18" \
            CURRENT_PROJECT_VERSION=1 \
            MARKETING_VERSION=1.2.1 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=TAROT_PRODUCTION_ADS \
            TAROT_ADS_MODE=production \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Verify signed archive and production release identity
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/TarotDeck-AppReview-1.2.1-1.xcarchive"
          APP_PATH="$ARCHIVE_PATH/Products/Applications/TarotDeckInternal.app"
          INFO_PLIST="$APP_PATH/Info.plist"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")"
          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          ENTITLEMENTS_PATH="$RUNNER_TEMP/archive-entitlements.plist"
          PROFILE_PATH="$RUNNER_TEMP/archive-profile.plist"

          test -d "$APP_PATH"
          test -f "$EXECUTABLE_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :TarotAdvertisingMode' "$INFO_PLIST")" == "production" ]]
          ADMOB_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$INFO_PLIST")"
          ADMOB_BANNER_ID="$(/usr/libexec/PlistBuddy -c 'Print :TarotBannerAdUnitID' "$INFO_PLIST")"
          [[ "$ADMOB_APP_ID" == "ca-app-pub-3425091654264901~4270953811" ]]
          [[ "$ADMOB_BANNER_ID" == "ca-app-pub-3425091654264901/3573694673" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")" == "com.krazel.tarotdeck" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")" == "Tarot Deck" ]]
          test -f "$APP_PATH/es.lproj/InfoPlist.strings"
          [[ "$(/usr/bin/plutil -extract CFBundleDisplayName raw -o - "$APP_PATH/es.lproj/InfoPlist.strings")" == "Mazo de tarot" ]]
          [[ -n "$(/usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "$INFO_PLIST")" ]]
          for language in en es; do
            TRACKING_STRINGS="$APP_PATH/$language.lproj/InfoPlist.strings"
            test -f "$TRACKING_STRINGS"
            [[ -n "$(/usr/bin/plutil -extract NSUserTrackingUsageDescription raw -o - "$TRACKING_STRINGS")" ]]
          done
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" == "1.2.1" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" == "1" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$INFO_PLIST")" == "16.0" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$INFO_PLIST")" == "false" ]]
          [[ "$(lipo -archs "$EXECUTABLE_PATH")" == *arm64* ]]

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PATH"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$ENTITLEMENTS_PATH")" == "false" ]]
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$PROFILE_PATH"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PATH")" == "false" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PATH")" == *.com.krazel.tarotdeck ]]

      - name: Export signed public-capable IPA
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          set +x
          ARCHIVE_PATH="$RUNNER_TEMP/TarotDeck-AppReview-1.2.1-1.xcarchive"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          EXPORT_PATH="$RUNNER_TEMP/tarot-app-review-export"
          EXPORT_OPTIONS="$RUNNER_TEMP/AppReviewExport.plist"

          /usr/bin/plutil -create xml1 "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :destination string export' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles:com.krazel.tarotdeck string Tarot Deck App Store 2026-10-18' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :testFlightInternalTestingOnly bool false' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$EXPORT_OPTIONS"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$EXPORT_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Verify exported IPA and create evidence manifest
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_PATH="$RUNNER_TEMP/tarot-app-review-export"
          SOURCE_IPA="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          VERIFY_PATH="$(mktemp -d "$RUNNER_TEMP/tarot-app-review-verify.XXXXXX")"
          OUTPUT_PATH="$RUNNER_TEMP/tarot-app-review-evidence"
          SHORT_COMMIT="${GITHUB_SHA:0:12}"
          BASE_NAME="TarotDeck-1.2.1-1-ci${GITHUB_RUN_NUMBER}-${SHORT_COMMIT}-App-Review-RC"
          IPA_PATH="$SOURCE_IPA"
          MANIFEST_PATH="$OUTPUT_PATH/${BASE_NAME}.manifest.json"
          SHA_PATH="$OUTPUT_PATH/${BASE_NAME}.sha256"

          test -n "$SOURCE_IPA"
          mkdir -p "$OUTPUT_PATH"
          cp "$RUNNER_TEMP/tarot-release-readiness.json" "$OUTPUT_PATH/readiness.json"
          /usr/bin/ditto -x -k "$IPA_PATH" "$VERIFY_PATH"
          APP_PATH="$(find "$VERIFY_PATH/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          INFO_PLIST="$APP_PATH/Info.plist"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$INFO_PLIST")"
          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          ENTITLEMENTS_PATH="$RUNNER_TEMP/export-entitlements.plist"

          test -d "$APP_PATH"
          test -f "$APP_PATH/PrivacyInfo.xcprivacy"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :TarotAdvertisingMode' "$INFO_PLIST")" == "production" ]]
          ADMOB_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$INFO_PLIST")"
          ADMOB_BANNER_ID="$(/usr/libexec/PlistBuddy -c 'Print :TarotBannerAdUnitID' "$INFO_PLIST")"
          [[ "$ADMOB_APP_ID" == "ca-app-pub-3425091654264901~4270953811" ]]
          [[ "$ADMOB_BANNER_ID" == "ca-app-pub-3425091654264901/3573694673" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")" == "com.krazel.tarotdeck" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")" == "Tarot Deck" ]]
          test -f "$APP_PATH/es.lproj/InfoPlist.strings"
          [[ "$(/usr/bin/plutil -extract CFBundleDisplayName raw -o - "$APP_PATH/es.lproj/InfoPlist.strings")" == "Mazo de tarot" ]]
          [[ -n "$(/usr/libexec/PlistBuddy -c 'Print :NSUserTrackingUsageDescription' "$INFO_PLIST")" ]]
          for language in en es; do
            TRACKING_STRINGS="$APP_PATH/$language.lproj/InfoPlist.strings"
            test -f "$TRACKING_STRINGS"
            [[ -n "$(/usr/bin/plutil -extract NSUserTrackingUsageDescription raw -o - "$TRACKING_STRINGS")" ]]
          done
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" == "1.2.1" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" == "1" ]]
          [[ "$(lipo -archs "$EXECUTABLE_PATH")" == *arm64* ]]
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PATH"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$ENTITLEMENTS_PATH")" == "false" ]]

          PROFILE_PATH="$RUNNER_TEMP/export-profile.plist"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$PROFILE_PATH"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PATH")" == "false" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PATH")" == *.com.krazel.tarotdeck ]]

          IPA_SHA256="$(shasum -a 256 "$IPA_PATH" | awk '{print $1}')"
          printf '%s  %s.ipa\n' "$IPA_SHA256" "$BASE_NAME" > "$SHA_PATH"
          jq -n \
            --arg app "Tarot Deck" \
            --arg version "1.2.1" \
            --arg build "1" \
            --arg bundleID "com.krazel.tarotdeck" \
            --arg commit "$GITHUB_SHA" \
            --arg ciRunNumber "$GITHUB_RUN_NUMBER" \
            --arg ciRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg ciRunID "$GITHUB_RUN_ID" \
            --arg purpose "App-Review-RC" \
            --arg admobApplicationID "$ADMOB_APP_ID" \
            --arg admobBannerID "$ADMOB_BANNER_ID" \
            --arg artifact "$BASE_NAME" \
            --arg sha256 "$IPA_SHA256" \
            '{schemaVersion: 1, app: $app, version: $version, build: $build, bundleID: $bundleID, commit: $commit, ciRunNumber: $ciRunNumber, ciRunAttempt: $ciRunAttempt, ciRunID: $ciRunID, purpose: $purpose, internalTestingOnly: false, externalTestingCapable: true, appStoreReleaseCapable: true, submittedForReview: false, advertisingMode: "production", admobApplicationID: $admobApplicationID, admobBannerID: $admobBannerID, artifact: $artifact, sha256: $sha256}' > "$MANIFEST_PATH"
          echo "artifact_name=$BASE_NAME" >> "$GITHUB_OUTPUT"

      - name: Preserve non-binary RC evidence
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.evidence.outputs.artifact_name }}
          path: ${{ runner.temp }}/tarot-app-review-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false

      - name: Upload binary to App Store Connect without submitting for review
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          set +x
          ARCHIVE_PATH="$RUNNER_TEMP/TarotDeck-AppReview-1.2.1-1.xcarchive"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          UPLOAD_OPTIONS="$RUNNER_TEMP/AppReviewUpload.plist"

          /usr/bin/plutil -create xml1 "$UPLOAD_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :method string app-store-connect' "$UPLOAD_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :destination string upload' "$UPLOAD_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$UPLOAD_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingCertificate string Apple Distribution' "$UPLOAD_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$UPLOAD_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles:com.krazel.tarotdeck string Tarot Deck App Store 2026-10-18' "$UPLOAD_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$UPLOAD_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :manageAppVersionAndBuildNumber bool false' "$UPLOAD_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :testFlightInternalTestingOnly bool false' "$UPLOAD_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$UPLOAD_OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :uploadSymbols bool true' "$UPLOAD_OPTIONS"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$UPLOAD_OPTIONS" \
            -exportPath "$RUNNER_TEMP/tarot-app-review-upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove temporary signing material
        if: ${{ always() }}
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          set +x
          rm -f "$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          security delete-keychain "$RUNNER_TEMP/tarot-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/tarot-distribution.p12" "$RUNNER_TEMP/tarot.mobileprovision" "$RUNNER_TEMP/tarot-profile.plist"
