name: Tarot TestFlight internal status

on:
  workflow_dispatch:
    inputs:
      internal_only_confirmation:
        description: Type TESTFLIGHT_INTERNAL_ONLY to verify and assign the current internal build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tarot-testflight-internal-status
  cancel-in-progress: false

jobs:
  verify-internal-build:
    name: Verify TestFlight INTERNAL ONLY - 0.7.2 (2)
    if: ${{ github.ref == 'refs/heads/main' && inputs.internal_only_confirmation == 'TESTFLIGHT_INTERNAL_ONLY' }}
    runs-on: macos-latest
    timeout-minutes: 40
    environment: app-store-production

    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate internal status workflow boundaries
        shell: pwsh
        run: ./native-ios/Tools/validate-testflight-status-workflow.ps1

      - name: Wait for processing and ensure internal Testers access
        id: status
        shell: bash
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          set +x
          : "${APP_STORE_CONNECT_API_KEY_ID:?missing protected API key id}"
          : "${APP_STORE_CONNECT_ISSUER_ID:?missing protected issuer id}"
          : "${APP_STORE_CONNECT_API_KEY_BASE64:?missing protected API key}"

          APP_ID="6800144105"
          MARKETING_VERSION="0.7.2"
          BUILD_NUMBER="2"
          API_ROOT="https://api.appstoreconnect.apple.com/v1"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          STATUS_PATH="$RUNNER_TEMP/tarot-testflight-status.json"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          TOKEN="$(KEY_PATH="$KEY_PATH" ruby -ropenssl -rbase64 -rjson -e '
            def b64(value)
              Base64.urlsafe_encode64(value).delete("=")
            end
            now = Time.now.to_i
            header = b64({alg: "ES256", kid: ENV.fetch("APP_STORE_CONNECT_API_KEY_ID"), typ: "JWT"}.to_json)
            payload = b64({iss: ENV.fetch("APP_STORE_CONNECT_ISSUER_ID"), iat: now - 20, exp: now + 900, aud: "appstoreconnect-v1"}.to_json)
            input = "#{header}.#{payload}"
            key = OpenSSL::PKey.read(File.read(ENV.fetch("KEY_PATH")))
            decoded = OpenSSL::ASN1.decode(key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(input)))
            raw = decoded.value.map { |item| item.value.to_s(2).rjust(32, "\0") }.join
            print "#{input}.#{b64(raw)}"
          ')"

          auth=(-H "Authorization: Bearer $TOKEN")
          build_id=""
          processing_state=""
          audience=""
          uploaded_date=""
          upload_id=""
          upload_state=""
          last_reported_state=""

          for attempt in $(seq 1 120); do
            response="$(curl --fail-with-body --silent --show-error --get "${auth[@]}" \
              --data-urlencode 'fields[buildUploads]=cfBundleShortVersionString,cfBundleVersion,createdDate,state,platform,uploadedDate,build' \
              --data-urlencode 'fields[builds]=version,uploadedDate,processingState,buildAudienceType,minOsVersion' \
              --data-urlencode "filter[cfBundleShortVersionString]=$MARKETING_VERSION" \
              --data-urlencode "filter[cfBundleVersion]=$BUILD_NUMBER" \
              --data-urlencode 'filter[platform]=IOS' \
              --data-urlencode 'include=build' \
              --data-urlencode 'limit=200' \
              "$API_ROOT/apps/$APP_ID/buildUploads")"
            upload_id="$(jq -r --arg version "$MARKETING_VERSION" --arg build "$BUILD_NUMBER" '
              [.data[] | select(.attributes.cfBundleShortVersionString == $version and .attributes.cfBundleVersion == $build and .attributes.platform == "IOS")][0].id // ""
            ' <<<"$response")"
            upload_state="$(jq -r --arg id "$upload_id" '.data[]? | select(.id == $id) | .attributes.state // ""' <<<"$response")"
            build_id="$(jq -r '[.included[]? | select(.type == "builds")][0].id // ""' <<<"$response")"
            if [[ -n "$build_id" ]]; then
              processing_state="$(jq -r --arg id "$build_id" '.included[] | select(.id == $id) | .attributes.processingState' <<<"$response")"
              audience="$(jq -r --arg id "$build_id" '.included[] | select(.id == $id) | .attributes.buildAudienceType' <<<"$response")"
              uploaded_date="$(jq -r --arg id "$build_id" '.included[] | select(.id == $id) | .attributes.uploadedDate' <<<"$response")"
              [[ "$audience" == "INTERNAL_ONLY" ]] || { echo "::error::Unexpected build audience: $audience"; exit 1; }
              if [[ "$processing_state" == "VALID" ]]; then
                break
              fi
              [[ "$processing_state" != "FAILED" && "$processing_state" != "INVALID" ]] || { echo "::error::Apple rejected build processing: $processing_state"; exit 1; }
            fi
            [[ "$upload_state" != "FAILED" ]] || { echo "::error::Apple rejected build upload processing: $upload_state"; exit 1; }
            current_state="upload=${upload_state:-NOT_VISIBLE}; build=${processing_state:-NOT_VISIBLE}"
            if [[ "$current_state" != "$last_reported_state" ]]; then
              echo "Apple processing state: $current_state"
              last_reported_state="$current_state"
            fi
            sleep 15
          done

          [[ -n "$build_id" && "$processing_state" == "VALID" ]] || { echo "::error::Build 0.7.2 (2) did not finish processing in time (upload=${upload_state:-NOT_VISIBLE}; build=${processing_state:-NOT_VISIBLE})."; exit 1; }

          groups="$(curl --fail-with-body --silent --show-error --get "${auth[@]}" \
            --data-urlencode 'fields[betaGroups]=name,isInternalGroup,hasAccessToAllBuilds' \
            --data-urlencode 'limit=200' \
            "$API_ROOT/apps/$APP_ID/betaGroups")"
          group_id="$(jq -r '[.data[] | select(.attributes.name == "Testers" and .attributes.isInternalGroup == true)][0].id // ""' <<<"$groups")"
          [[ -n "$group_id" ]] || { echo "::error::Existing internal Testers group not found."; exit 1; }

          group_builds="$(curl --fail-with-body --silent --show-error --get "${auth[@]}" \
            --data-urlencode 'fields[builds]=version,processingState,buildAudienceType' \
            --data-urlencode 'limit=200' \
            "$API_ROOT/betaGroups/$group_id/builds")"
          if ! jq -e --arg id "$build_id" 'any(.data[]; .id == $id)' <<<"$group_builds" >/dev/null; then
            payload="$(jq -n --arg id "$build_id" '{data: [{type: "builds", id: $id}]}')"
            curl --fail-with-body --silent --show-error \
              -X POST "${auth[@]}" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "$API_ROOT/betaGroups/$group_id/relationships/builds"
          fi

          verified="$(curl --fail-with-body --silent --show-error --get "${auth[@]}" \
            --data-urlencode 'fields[builds]=version,processingState,buildAudienceType' \
            --data-urlencode 'limit=200' \
            "$API_ROOT/betaGroups/$group_id/builds")"
          jq -e --arg id "$build_id" 'any(.data[]; .id == $id and .attributes.processingState == "VALID" and .attributes.buildAudienceType == "INTERNAL_ONLY")' <<<"$verified" >/dev/null

          jq -n \
            --arg app "Tarot Deck" \
            --arg version "$MARKETING_VERSION" \
            --arg build "$BUILD_NUMBER" \
            --arg uploadID "$upload_id" \
            --arg uploadState "$upload_state" \
            --arg buildID "$build_id" \
            --arg processingState "$processing_state" \
            --arg audience "$audience" \
            --arg uploadedDate "$uploaded_date" \
            --arg group "Testers" \
            --arg commit "$GITHUB_SHA" \
            --arg ciRunID "$GITHUB_RUN_ID" \
            '{schemaVersion: 1, app: $app, version: $version, build: $build, uploadID: $uploadID, uploadState: $uploadState, buildID: $buildID, processingState: $processingState, buildAudienceType: $audience, uploadedDate: $uploadedDate, internalGroup: $group, groupAccessVerified: true, commit: $commit, ciRunID: $ciRunID, externalTestingEnabled: false, appStoreSubmitted: false}' > "$STATUS_PATH"
          rm -f "$KEY_PATH"
          echo "status_path=$STATUS_PATH" >> "$GITHUB_OUTPUT"

      - name: Preserve non-binary processing evidence
        uses: actions/upload-artifact@v4
        with:
          name: TarotDeck-0.7.2-2-TestFlight-Internal-Status
          path: ${{ steps.status.outputs.status_path }}
          if-no-files-found: error
          retention-days: 7
